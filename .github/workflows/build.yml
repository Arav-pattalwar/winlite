name: Build WinLite ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: Build ISO
        run: |
          chmod +x build.sh config/hooks/live/*.chroot config/includes.chroot/usr/local/bin/*
          sudo ARCH=${{ matrix.arch }} ./build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: winlite-${{ matrix.arch }}-iso
          path: "*.iso"
          retention-days: 14
          compression-level: 0
